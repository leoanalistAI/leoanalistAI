<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="ありがとう — obrigado pela visita">
  <defs>
    <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#c9a96e" stroke-opacity="0.28" stroke-width="1.2">
        <circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="8"/>
        <circle cx="0" cy="10" r="18"/><circle cx="40" cy="10" r="18"/>
      </g>
    </pattern>
    <style>
      .jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .wave { animation: drift 20s linear infinite; }
      @keyframes drift { to { transform: translateX(-40px); } }
    </style>
  </defs>
  <rect width="1200" height="120" rx="12" fill="#0b1026"/>
  <g class="wave"><rect width="1260" height="120" fill="url(#seigaiha)"/></g>
  <circle cx="600" cy="60" r="34" fill="#bc002d"/>
  <text x="600" y="68" class="jp" fill="#f5efe6" font-size="22" font-weight="700" text-anchor="middle">感謝</text>
  <text x="420" y="66" class="jp" fill="#f5efe6" font-size="22" text-anchor="end">ありがとう</text>
  <text x="780" y="66" class="sans" fill="#c9cfdd" font-size="18">obrigado pela visita</text>
</svg>
