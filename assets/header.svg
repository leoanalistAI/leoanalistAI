<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Leandro Almeida — Dados e IA para Supply Chain">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#2a1b3d"/>
      <stop offset="1" stop-color="#5c2a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a5f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#c9a96e" stroke-opacity="0.18" stroke-width="1.2">
        <circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="8"/>
        <circle cx="0" cy="10" r="18"/><circle cx="40" cy="10" r="18"/>
      </g>
    </pattern>
    <g id="petal">
      <path d="M0,-7 C5,-7 7,-2 0,7 C-7,-2 -5,-7 0,-7 Z" fill="#ffb7c5"/>
      <path d="M0,-7 L0,-3" stroke="#ff8fa8" stroke-width="1"/>
    </g>
    <style>
      .fall { animation: fall linear infinite; }
      @keyframes fall {
        0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translate(-160px, 420px) rotate(540deg); opacity: 0; }
      }
      .sun { animation: breathe 6s ease-in-out infinite; transform-origin: 860px 175px; }
      @keyframes breathe { 50% { transform: scale(1.04); } }
      .title { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif; }
      .jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- céu -->
  <rect width="1200" height="380" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#fff" opacity="0.6">
    <circle cx="80" cy="40" r="1"/><circle cx="210" cy="70" r="1.2"/><circle cx="340" cy="30" r="0.8"/>
    <circle cx="480" cy="60" r="1"/><circle cx="620" cy="25" r="1.3"/><circle cx="1010" cy="45" r="1"/>
    <circle cx="1120" cy="90" r="0.9"/><circle cx="1160" cy="30" r="1.2"/><circle cx="560" cy="110" r="0.8"/>
  </g>

  <!-- sol nascente -->
  <circle cx="860" cy="175" r="190" fill="url(#glow)"/>
  <circle class="sun" cx="860" cy="175" r="105" fill="#bc002d"/>

  <!-- Monte Fuji -->
  <path d="M600,380 L790,215 Q815,195 840,205 L870,190 Q885,183 900,195 L930,215 L1200,380 Z" fill="url(#fuji)"/>
  <path d="M790,215 Q815,195 840,205 L870,190 Q885,183 900,195 L930,215 L912,232 L895,218 L878,236 L858,220 L838,238 L818,222 L800,236 Z" fill="#e9edf5"/>

  <!-- ondas seigaiha -->
  <rect y="300" width="1200" height="80" fill="#0b1026" opacity="0.85"/>
  <rect y="300" width="1200" height="80" fill="url(#seigaiha)"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#c9a96e" stroke-opacity="0.5"/>

  <!-- galho de sakura -->
  <g stroke="#3a2420" stroke-linecap="round" fill="none">
    <path d="M1200,0 C1120,40 1080,70 1010,85" stroke-width="7"/>
    <path d="M1100,45 C1090,80 1070,105 1045,120" stroke-width="4"/>
    <path d="M1150,20 C1160,60 1150,95 1135,115" stroke-width="3"/>
  </g>
  <g>
    <use href="#petal" transform="translate(1010,85) scale(1.6)"/>
    <use href="#petal" transform="translate(1030,72) rotate(70) scale(1.4)"/>
    <use href="#petal" transform="translate(1045,120) rotate(-30) scale(1.5)"/>
    <use href="#petal" transform="translate(1060,100) rotate(140) scale(1.3)"/>
    <use href="#petal" transform="translate(1135,115) rotate(20) scale(1.5)"/>
    <use href="#petal" transform="translate(1120,60) rotate(200) scale(1.4)"/>
    <use href="#petal" transform="translate(1160,75) rotate(90) scale(1.3)"/>
    <use href="#petal" transform="translate(1085,58) rotate(-80) scale(1.2)"/>
  </g>

  <!-- pétalas caindo -->
  <g>
    <g class="fall" style="animation-duration:9s;animation-delay:0s"><use href="#petal" transform="translate(1050,90)"/></g>
    <g class="fall" style="animation-duration:11s;animation-delay:2s"><use href="#petal" transform="translate(1120,70)"/></g>
    <g class="fall" style="animation-duration:8s;animation-delay:4s"><use href="#petal" transform="translate(980,60)"/></g>
    <g class="fall" style="animation-duration:12s;animation-delay:1s"><use href="#petal" transform="translate(760,10)"/></g>
    <g class="fall" style="animation-duration:10s;animation-delay:5s"><use href="#petal" transform="translate(620,0)"/></g>
    <g class="fall" style="animation-duration:13s;animation-delay:3s"><use href="#petal" transform="translate(1180,40)"/></g>
    <g class="fall" style="animation-duration:9.5s;animation-delay:6s"><use href="#petal" transform="translate(880,30)"/></g>
  </g>

  <!-- kanji vertical 改善 -->
  <g class="jp" fill="#f5efe6" font-size="54" font-weight="700" text-anchor="middle">
    <text x="90" y="125">改</text>
    <text x="90" y="190">善</text>
  </g>
  <rect x="72" y="210" width="36" height="36" rx="4" fill="#bc002d"/>
  <text x="90" y="236" class="jp" fill="#f5efe6" font-size="20" text-anchor="middle">印</text>

  <!-- texto principal -->
  <text x="160" y="140" class="title" fill="#f5efe6" font-size="56" font-weight="700" letter-spacing="1">Leandro Almeida</text>
  <text x="162" y="182" class="jp" fill="#ffb7c5" font-size="22" letter-spacing="6">データ × AI × サプライチェーン</text>
  <text x="162" y="222" class="sans" fill="#c9cfdd" font-size="20">Dados &amp; IA aplicados a Supply Chain, PCP e Automação</text>
  <text x="162" y="262" class="sans" fill="#c9a96e" font-size="16" font-style="italic">改善 · kaizen — melhoria contínua, um commit por vez</text>
</svg>
